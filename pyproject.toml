[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polymarket-alpha"
version = "0.1.0"
description = "Polymarket top-trader strategy auditor (research tool)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-cov",
]

[project.scripts]
polymarket-alpha = "polymarket_alpha.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["polymarket_alpha"]

[tool.pytest.ini_options]
testpaths = ["polymarket_alpha/tests"]
addopts = "-q"
asyncio_mode = "auto"
